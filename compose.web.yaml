# Web app and HTTPS in a container (W08, P-56): Caddy serves the dispatcher web app at /app/, proxies /api/ to the app
# and gets certificates for PATHWISE_DOMAIN by itself. With the VPS stack (docs/DEPLOYMENT.md §8):
#   docker compose -f compose.prod.yaml -f compose.web.yaml up -d          # add -f compose.routing.yaml if used
# Instead of this file, a Caddy installed on the host can use deploy/caddy/Caddyfile with the web tarball of the
# GitHub release. Variables come from .env (see .env.prod.example).
# With ufw-docker, open 80/443 for this container with `ufw-docker allow` (plain `ufw allow` does not reach containers).

# Docker keeps container logs without limit by default: a small VPS fills its disk (T51, P-59). Each container keeps
# at most LOG_MAX_FILE files of LOG_MAX_SIZE (30 MB by default); older lines are dropped.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

services:
  web:
    logging: *logging
    image: ${WEB_IMAGE:-ghcr.io/huyga1185/pathwise-web}:${APP_IMAGE_TAG:?set in .env, e.g. 0.1.0 or develop}
    restart: unless-stopped
    environment:
      PATHWISE_DOMAIN: ${PATHWISE_DOMAIN:?set in .env, e.g. pathwise.example.com}
      PATHWISE_MAPTILER_KEY: ${MAPTILER_KEY:-}
      PATHWISE_BASEMAP: ${WEB_BASEMAP:-maptiler}
      # Cloudflare (or another proxy) in front of Caddy: its ranges, so the app gets the user's IP (F-59, DEPLOYMENT §8.3).
      PATHWISE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Certificates and ACME account: keep them, or Let's Encrypt rate limits hit on every recreate.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
