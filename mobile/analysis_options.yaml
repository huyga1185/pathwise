# Strict analysis (docs/client/PLAN.md M00): flutter_lints plus the rules below; generated code is excluded.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - packages/pathwise_api/**
    - lib/shared/theme/tokens.g.dart
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
    - directives_ordering

formatter:
  page_width: 120
