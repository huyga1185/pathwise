name: pathwise_driver
description: "PathWise — app tài xế (docs/client/PLAN.md M00–M03)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

# P-44. Versions released at least two weeks before M00 (docs/client/README.md §2); the lockfile pins them.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pathwise_api:
    path: packages/pathwise_api
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: 18.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  url_launcher: ^6.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  # Be Vietnam Pro is bundled (ARCHITECTURE §8: no font download at run time). Licence: assets/fonts/OFL.txt.
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
