# E2E stack (W07, docs/client/PLAN.md): compose.yaml + this file, in a project of its own so it never touches the
# dev database or the dev Mailpit:
#   export E2E_JWT_SECRET="$(openssl rand -base64 32)"
#   docker compose -p pathwise-e2e --env-file web/e2e/e2e.env -f compose.yaml -f compose.e2e.yaml --profile app up -d --build --wait
# The backend's map clients point at a stub (web/e2e/stub/server.mjs): the run calls no real third-party service.
# Mail goes to this project's Mailpit only.

# Docker keeps container logs without limit by default: a small VPS fills its disk (T51, P-59). Each container keeps
# at most LOG_MAX_FILE files of LOG_MAX_SIZE (30 MB by default); older lines are dropped.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

services:
  map-stub:
    logging: *logging
    image: node:22-alpine
    command: ["node", "/stub/server.mjs"]
    volumes:
      - ./web/e2e/stub:/stub:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    logging: *logging
    # Only the values below: a developer's .env must not leak in (it may point at a real SMTP server).
    env_file: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Generated per run, never committed: export E2E_JWT_SECRET="$(openssl rand -base64 32)"
      TOKEN_JWT_ACCESS_TOKEN_SECRET: ${E2E_JWT_SECRET:?export E2E_JWT_SECRET=$(openssl rand -base64 32) before starting the E2E stack}
      MAIL_OTP_SENDER_ADDRESS: no-reply@pathwise.local
      MAIL_OTP_SENDER_NAME: PathWise
      SERVICE_IDENTITY_APP_URL: http://localhost:4173
      SERVICE_IDENTITY_APP_NAME: PathWise
      SERVICE_IDENTITY_COMPANY_NAME: PathWise
      SERVICE_IDENTITY_COMPANY_URL: http://localhost:4173
      SERVICE_IDENTITY_COMPANY_ADDRESS: E2E
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      ROUTING_GEOCODING_NOMINATIM_BASEURL: http://map-stub:8090
      ROUTING_GEOCODING_NOMINATIM_RATELIMIT_ENABLED: "false"
      ROUTING_MATRIX_OSRM_BASEURL: http://map-stub:8090
      # A short solver run keeps the E2E fast (the default is 10 s, NFR-02).
      ROUTING_SOLVER_TIMELIMIT: 2s
      # First ADMIN of the stack (T59), for the ADMIN area E2E (W11).
      BOOTSTRAP_ADMIN_EMAIL: admin@pathwise.test
      BOOTSTRAP_ADMIN_PASSWORD: matkhau-admin-e2e
      # Every spec registers a store from the same IP; the production limit (5 an hour) stops a second local run on the
      # same stack. Map keys with "-" cannot be set by plain variables, hence JSON.
      SPRING_APPLICATION_JSON: '{"rate-limit":{"rules":{"register-ip":{"limit":100}}}}'
    depends_on:
      map-stub:
        condition: service_healthy
