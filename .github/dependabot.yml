# Weekly dependency updates (ARCHITECTURE.md §12.3). PRs target develop (D-34).
# Note: GitHub reads this file from the default branch (main), so it takes effect once develop is merged into main.
version: 2
updates:
  - package-ecosystem: maven
    directory: /be
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /be
    target-branch: develop
    schedule:
      interval: weekly
