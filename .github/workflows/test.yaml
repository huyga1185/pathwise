name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Integration tests start MariaDB 11.8 and Redis via Testcontainers (Docker is available on ubuntu-latest).
      # Minimal workflow for T01; replaced by ci.yml in T06.
      - run: cd be && ./mvnw -B -ntp test
