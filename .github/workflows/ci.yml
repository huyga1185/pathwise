# Required check before merging into develop/main (ARCHITECTURE.md §12.3, D-31).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      web: ${{ steps.detect.outputs.web }}
      e2e: ${{ steps.detect.outputs.e2e }}
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/detect-code-changes

  # Skipped (not removed) on docs-only changes: a skipped job still satisfies the required "ci" check,
  # whereas a workflow filtered out by paths-ignore never reports and blocks the PR.
  # Runs anyway if change detection itself failed.
  ci:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Client contract and theme generators (docs/client/ARCHITECTURE.md §3, §8); fast, so before the build.
      - name: Script tests
        working-directory: .
        run: python3 -B -m unittest discover -s scripts/tests
      # Integration tests start MariaDB 11.8 and Redis via Testcontainers (Docker is available on ubuntu-latest).
      - name: Build and test
        run: ./mvnw -B -ntp verify
      # ApiSpecContractIntegrationTest wrote target/openapi.json; clients generate code from api/openapi.json (P-41).
      - name: Check API contract snapshot
        working-directory: .
        run: python3 -B scripts/openapi_snapshot.py check
      - name: Coverage summary
        if: always() && hashFiles('be/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
            function pct(c, m) { return (c + m) ? sprintf("%.1f%%", 100 * c / (c + m)) : "n/a" }
            END {
              print "### Coverage (JaCoCo)"
              print ""
              print "| Counter | Covered | Total | % |"
              print "|---|---|---|---|"
              printf "| Line | %d | %d | %s |\n", lc, lc + lm, pct(lc, lm)
              printf "| Branch | %d | %d | %s |\n", bc, bc + bm, pct(bc, bm)
              printf "| Instruction | %d | %d | %s |\n", ic, ic + im, pct(ic, im)
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: be/target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: be/target/site/jacoco/
          if-no-files-found: ignore
      # For client code generation and design (docs/ux/UX_BRIEF.md): the generated OpenAPI document and realistic
      # responses captured by the acceptance tests.
      - name: Upload API contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: |
            be/target/openapi.json
            be/target/ux-samples/
          if-no-files-found: ignore

  # Web dispatcher (docs/client/PLAN.md W01). Runs when the web client or its inputs change.
  web:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Generated files must match their sources (P-41, P-42).
      - name: Check generated theme and API types
        run: |
          python3 -B ../scripts/build_tokens.py --check --only web
          pnpm gen:api
          git diff --exit-code -- src/data/schema.d.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # Driver app (M00): the Flutter version of mobile/pubspec.yaml; generated files must match their sources.
  mobile:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - name: Install
        run: flutter pub get
      - name: Check generated theme and API client
        run: |
          python3 -B ../scripts/build_tokens.py --check --only mobile
          ../scripts/gen_dart_api.sh
          git add --intent-to-add packages/pathwise_api
          git diff --exit-code -- packages/pathwise_api
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # End-to-end on the real backend (W07): compose stack with a map stub (compose.e2e.yaml), the production web build
  # served by vite preview, Playwright through the MVP path. Mail stays in the stack's Mailpit; no third-party call.
  e2e:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -p pathwise-e2e --env-file web/e2e/e2e.env -f compose.yaml -f compose.e2e.yaml --profile app
    steps:
      - uses: actions/checkout@v4
      # The stack's JWT key is generated for this run only and masked in the logs; no secret lives in the repo.
      - name: Generate the E2E JWT key
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "E2E_JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Start the E2E stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: E2E
        working-directory: web
        run: pnpm e2e
      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color > e2e-stack.log
      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
            e2e-stack.log
          retention-days: 7
      - name: Stop the E2E stack
        if: always()
        run: $COMPOSE down -v
