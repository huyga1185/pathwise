# Build, scan and publish the app image to GHCR (ARCHITECTURE.md §12.3, D-31, D-34).
#   push to develop -> develop, develop-<shortsha>   (staging)
#   tag v*          -> x.y.z, x.y, latest           (prod)
name: image

on:
  push:
    branches: [develop]
    tags: ['v*']
    # Docs-only pushes would rebuild an identical image. Not a required check, so a trigger filter is fine;
    # GitHub ignores path filters for tag pushes, so releases always build.
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pathwise
  # Mirrors first: ghcr.io often rate-limits the Trivy databases.
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=develop-,format=short,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Build once into the local daemon so Trivy scans exactly what gets pushed.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: be
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy report (HIGH, CRITICAL)
        # Pinned to an immutable commit: trivy-action tags < 0.35.0 were force-pushed to malware (GHSA-69fq-xp46-6x23).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'
          version: v0.70.0
      - name: Write Trivy report to job summary
        if: always()
        run: |
          {
            echo '### Trivy (HIGH, CRITICAL)'
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Gate: fail on CRITICAL vulnerabilities that already have a fix.
      - name: Trivy gate (CRITICAL with fix)
        # Pinned to an immutable commit: trivy-action tags < 0.35.0 were force-pushed to malware (GHSA-69fq-xp46-6x23).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true # reuse the Trivy installed by the previous step
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: be
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
