# Test profile: dummy values only. Datasource and Redis come from Testcontainers (@ServiceConnection).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025

mail:
  otp:
    sender:
      address: no-reply@pathwise.test
      name: PathWise Test

# Not the 5 min default, so tests prove the value comes from configuration (F-09).
otp:
  ttl: 2m

token:
  jwt:
    # 256-bit all-zero key, test only
    access-token-secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

service:
  identity:
    app-url: http://localhost
    app-name: PathWise
    company-name: PathWise
    company-url: http://localhost
    company-address: Test

# Geocoding jobs run in the request thread after commit, so tests see their result without waiting. The async mode
# is tested by GeocodePlanJobAsyncIntegrationTest.
jobs:
  geocode-plan:
    mode: inline
