<!DOCTYPE html>
<!--/* Card of the OTP emails (verify email, reset and change password). Parameters: heading, intro, codeLabel, ignore
       (what to do if the reader did not ask). Variables: otp, validMinutes, to, companyName. The code stays alone in
       its element: tests read it with >(\d{6})<. Digits are spread by letter-spacing, so a copy gives 6 digits. */-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="card(heading, intro, codeLabel, ignore)">
    <h1 th:replace="~{email/fragments/parts :: heading(${heading})}">Tiêu đề</h1>
    <p th:replace="~{email/fragments/parts :: hello}">Xin chào</p>
    <p style="margin: 0 0 16px;" th:text="${intro}">Nhập mã dưới đây:</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 0 0 24px;">
        <tr>
            <td align="center" bgcolor="#dcebe6" style="background-color: #dcebe6; border-radius: 12px; padding: 20px 16px; text-align: center;">
                <div th:text="${codeLabel}"
                     style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #56635e;">Mã xác thực</div>
                <div th:text="${otp}"
                     style="margin: 8px 0; padding-left: 10px; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: 10px; color: #0b6a5c;">123456</div>
                <div style="font-size: 13px; line-height: 18px; color: #56635e;">
                    Hết hạn sau <strong th:text="${validMinutes}">5</strong> phút · chỉ dùng một lần</div>
            </td>
        </tr>
    </table>
    <p style="margin: 0 0 16px; font-size: 14px; color: #56635e;">
        Nhập sai quá số lần cho phép thì mã bị huỷ và bạn cần yêu cầu mã mới.</p>
    <table th:replace="~{email/fragments/parts :: note('Không chia sẻ mã này với bất kỳ ai',
            'Kể cả người tự xưng là nhân viên ' + ${companyName} + '. ' + ${ignore}, '#9a5200')}"></table>
</th:block>
</body>
</html>
