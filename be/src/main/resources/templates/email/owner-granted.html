<!DOCTYPE html>
<!--/* New OWNER after an ADMIN transferred a store (T57, P-63). Variables: storeName, to, appName, webUrl and the
       service identity (added by EmailNotificationService). */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: email(title='Bạn đã trở thành chủ cửa hàng', tag='Cửa hàng', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 th:replace="~{email/fragments/parts :: heading('Bạn là chủ cửa hàng ' + ${storeName})}">Tiêu đề</h1>
    <p th:replace="~{email/fragments/parts :: hello}">Xin chào</p>
    <p style="margin: 0 0 16px;">
        Theo yêu cầu hỗ trợ, quản trị viên <span th:text="${appName}">PathWise</span> đã chuyển quyền chủ cửa hàng
        <strong th:text="${storeName}">Cửa hàng An</strong> cho bạn.</p>
    <table th:replace="~{email/fragments/parts :: facts('Cửa hàng', ${storeName}, 'Vai trò mới', 'Chủ cửa hàng',
            'Hiệu lực', 'Từ lần đăng nhập tới')}"></table>
    <p style="margin: 0 0 16px;">Bạn quản lý được thông tin cửa hàng, thành viên và lời mời.</p>
    <table th:replace="~{email/fragments/parts :: button(${webUrl}, 'Mở ' + ${appName})}"></table>
    <table th:replace="~{email/fragments/parts :: note('Không biết việc này?',
            'Hãy liên hệ hỗ trợ của ' + ${appName} + '.', '#2a5aa8')}"></table>
</th:block>
</body>
</html>
