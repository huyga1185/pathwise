<!DOCTYPE html>
<!--/* Invitation to join a store (T16, P-69). Variables: storeName, roleName (lower case), code, link (accept page with
       the code), expiresAt (dd/MM/yyyy HH:mm, store time), validDays, to, appName, webUrl and the service identity
       (added by EmailNotificationService). The code stays alone in its element: tests read it with >(43 chars)<. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: email(title='Lời mời tham gia cửa hàng', tag='Lời mời', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 th:replace="~{email/fragments/parts :: heading('Bạn được mời tham gia ' + ${storeName})}">Tiêu đề</h1>
    <p th:replace="~{email/fragments/parts :: hello}">Xin chào</p>
    <p style="margin: 0 0 16px;">
        Cửa hàng <strong th:text="${storeName}">Cửa hàng An</strong> mời bạn dùng <span th:text="${appName}">PathWise</span>
        với vai trò <strong th:text="${roleName}">tài xế</strong>.
        Bấm nút dưới đây để nhận lời mời và đặt mật khẩu cho tài khoản của bạn.</p>
    <table th:replace="~{email/fragments/parts :: facts('Cửa hàng', ${storeName}, 'Vai trò', ${#strings.capitalize(roleName)},
            'Hết hạn', ${expiresAt} + ' (' + ${validDays} + ' ngày)')}"></table>
    <table th:replace="~{email/fragments/parts :: button(${link}, 'Nhận lời mời')}"></table>
    <p style="margin: 0 0 16px; font-size: 14px; color: #56635e;">
        Không bấm được nút? Mở <span th:text="${appName}">PathWise</span>, chọn <strong>Nhập mã mời</strong> rồi dán mã này:</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 0 0 24px;">
        <tr>
            <td th:text="${code}" bgcolor="#f4f6f3"
                style="background-color: #f4f6f3; border: 1px dashed #c9d1cd; border-radius: 8px; padding: 12px 16px; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 14px; line-height: 20px; word-break: break-all; color: #18231f;">mã-mời</td>
        </tr>
    </table>
    <table th:replace="~{email/fragments/parts :: note('Mã chỉ dùng được một lần',
            'Không chia sẻ mã hay chuyển tiếp email này. Nếu bạn không biết cửa hàng này, hãy bỏ qua email.', '#9a5200')}"></table>
</th:block>
</body>
</html>
