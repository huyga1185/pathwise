<!DOCTYPE html>
<!--/* Password reset link sent by an ADMIN (T57, P-63). Variables: link, validHours, to, appName and the service
       identity (added by EmailNotificationService). The link does not contain the email. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: email(title='Đặt lại mật khẩu', tag='Hỗ trợ tài khoản', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 th:replace="~{email/fragments/parts :: heading('Đặt mật khẩu mới')}">Tiêu đề</h1>
    <p th:replace="~{email/fragments/parts :: hello}">Xin chào</p>
    <p style="margin: 0 0 16px;">
        Theo yêu cầu hỗ trợ của bạn, quản trị viên <span th:text="${appName}">PathWise</span> đã gửi link đặt lại mật khẩu
        cho tài khoản này.</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin: 0 0 16px;">
        <tr th:each="step, i : ${ {'Bấm nút dưới đây để mở trang đặt lại mật khẩu.',
                'Bấm “Gửi mã”: mã xác nhận được gửi tới chính email này.', 'Nhập mã và mật khẩu mới.'} }">
            <td style="width: 32px; padding: 6px 0; vertical-align: top;">
                <span th:text="${i.count}"
                      style="display: inline-block; width: 24px; height: 24px; border-radius: 12px; background-color: #dcebe6; color: #0b6a5c; font-weight: 700; font-size: 13px; line-height: 24px; text-align: center;">1</span>
            </td>
            <td th:text="${step}" style="padding: 6px 0; vertical-align: top;">Bước</td>
        </tr>
    </table>
    <table th:replace="~{email/fragments/parts :: button(${link}, 'Đặt mật khẩu mới')}"></table>
    <p style="margin: 0 0 16px; font-size: 14px; color: #56635e;">
        Link mở được trong <strong th:text="${validHours} + ' giờ'">24 giờ</strong> và hết hiệu lực khi bạn đã đặt mật khẩu mới.
        Quản trị viên không biết và không đặt được mật khẩu của bạn.</p>
    <table th:replace="~{email/fragments/parts :: note('Không chuyển tiếp email này cho ai',
            'Nếu bạn không nhờ hỗ trợ, hãy bỏ qua email: mật khẩu hiện tại vẫn giữ nguyên.', '#9a5200')}"></table>
</th:block>
</body>
</html>
