<!DOCTYPE html>
<!--/* Former OWNER after an ADMIN transferred a store (T57, P-63). Variables: storeName, to, appName and the service
       identity (added by EmailNotificationService). The new owner is not named. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: email(title='Quyền chủ cửa hàng đã được chuyển', tag='Cửa hàng', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 th:replace="~{email/fragments/parts :: heading('Quyền chủ cửa hàng đã được chuyển')}">Tiêu đề</h1>
    <p th:replace="~{email/fragments/parts :: hello}">Xin chào</p>
    <p style="margin: 0 0 16px;">
        Theo yêu cầu hỗ trợ, quản trị viên <span th:text="${appName}">PathWise</span> đã chuyển quyền chủ cửa hàng
        <strong th:text="${storeName}">Cửa hàng An</strong> cho một thành viên khác.</p>
    <table th:replace="~{email/fragments/parts :: facts('Cửa hàng', ${storeName}, 'Vai trò mới', 'Điều phối viên',
            'Phiên đăng nhập', 'Đã đăng xuất khỏi mọi thiết bị')}"></table>
    <table th:replace="~{email/fragments/parts :: note('Không phải bạn yêu cầu?', 'Hãy liên hệ hỗ trợ ngay.', '#b02a22')}"></table>
</th:block>
</body>
</html>
