spring:
  application:
    name: pathwise
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

api:
  user-agent: PathWise/1.0 (https://huy-vu.uk/)
  matrix:
    osrm-base-url: http://router.project-osrm.org

routing:
  geocoding:
    provider: nominatim
    cache-ttl: 24h
    nominatim:
      base-url: https://nominatim.openstreetmap.org
      user-agent: PathWise/1.0 (https://huy-vu.uk/)
      connect-timeout: 3s
      read-timeout: 10s
      rate-limit:
        # Nominatim usage policy: at most 1 request per second. Turn off only for a self-hosted Nominatim (D-25).
        enabled: true
        per-second: 1
        max-wait: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP outages must not mark the whole service DOWN; email failures are handled per request.
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false